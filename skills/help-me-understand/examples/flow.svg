<svg xmlns="http://www.w3.org/2000/svg" width="480" height="1020" viewBox="0 0 480 1020" role="img" aria-labelledby="title desc">
  <title id="title">资料处理器的检查、生成与核对流程</title>
  <desc id="desc">自拟教学示例。接收文件后同时检查格式和访问权限。两项都通过才进入处理队列；任一失败返回原因。解释生成时若来源不完整，暂停并请求补材料，补齐后回到生成环节。生成完成后由用户核对。</desc>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#466273"/></marker></defs>
  <style>
    text{font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;fill:#203644;text-anchor:middle;font-size:19px}
    .node{fill:#edf4f5;stroke:#73939a;stroke-width:1.5;rx:10}
    .decision{fill:#fff5dc;stroke:#b79550;stroke-width:1.5}
    .edge{fill:none;stroke:#466273;stroke-width:1.8;marker-end:url(#arrow)}
    .note{font-size:16px;fill:#526a78}
    .label{font-size:17px}
  </style>
  <rect width="480" height="1020" fill="#fff"/>
  <text x="240" y="32" style="font-size:23px;font-weight:600">资料怎样变成待核对的解释</text>
  <text class="note" x="240" y="60">自拟教学流程 · 不代表实际产品</text>
  <rect class="node" x="75" y="85" width="230" height="50"/><text x="190" y="117">接收文件</text>
  <path class="edge" d="M190 135 V158 H100 V184"/><path class="edge" d="M190 158 H290 V184"/>
  <text class="label" x="190" y="177">同时</text>
  <rect class="node" x="17" y="185" width="166" height="56"/><text x="100" y="220">格式检查</text>
  <rect class="node" x="207" y="185" width="166" height="56"/><text x="290" y="220">访问权限检查</text>
  <path class="edge" d="M100 241 V269 H190 V290"/><path d="M290 241 V269 H190" fill="none" stroke="#466273" stroke-width="1.8"/>
  <path class="decision" d="M190 290 L303 344 L190 398 L77 344Z"/>
  <text x="190" y="340">两项检查</text><text x="190" y="365">都通过？</text>
  <path class="edge" d="M303 344 H347"/><text class="label" x="375" y="294">任一失败</text>
  <rect class="node" x="349" y="306" width="115" height="76"/><text x="406" y="335">返回原因</text><text x="406" y="360">停止处理</text>
  <path class="edge" d="M190 398 V446"/><text class="label" x="222" y="426">是</text>
  <rect class="node" x="75" y="448" width="230" height="54"/><text x="190" y="482">进入处理队列</text>
  <path class="edge" d="M190 502 V551"/>
  <rect class="node" x="75" y="553" width="230" height="56"/><text x="190" y="588">解释生成环节</text>
  <path class="edge" d="M190 609 V654"/>
  <path class="decision" d="M190 656 L303 710 L190 764 L77 710Z"/>
  <text x="190" y="706">来源是否</text><text x="190" y="730">完整？</text>
  <path class="edge" d="M303 710 H347"/><text class="label" x="329" y="699">否</text>
  <rect class="node" x="349" y="672" width="115" height="78"/><text x="406" y="702">暂停</text><text x="406" y="728">请补材料</text>
  <path class="edge" d="M406 672 V581 H307"/><text class="label" x="402" y="554">补齐后返回</text>
  <path class="edge" d="M190 764 V811"/><text class="label" x="223" y="793">是</text>
  <rect class="node" x="75" y="813" width="230" height="54"/><text x="190" y="847">解释生成完成</text>
  <path class="edge" d="M190 867 V910"/>
  <rect class="node" x="75" y="912" width="230" height="54"/><text x="190" y="946">用户核对内容</text>
  <text class="note" x="240" y="995">检查通过 ≠ 生成完成 ≠ 内容已核对</text>
</svg>
